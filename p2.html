<video id="cam" autoplay playsinline width="320" height="240"></video>
<canvas id="frame" width="320" height="240" style="display:none;"></canvas>

<div>
    <button onclick="tanganiMulaiKamera()">Buka Kamera</button>
    <button onclick="tanganiAmbilFrame()">Ambil Frame</button>
    <button onclick="tanganiHitungKecerahan()">Rata Kecerahan</button>
</div>

<p id="hasil">Kecerahan: -</p>

<script>
let videoElem = document.getElementById('cam');
let canvasElem = document.getElementById('frame');
let lastImageData = null;
let cameraStream = null;


// ==================================================
// 1. MEMBUKA KAMERA DAN MEMINTA IZIN
// ==================================================
async function mulaiKamera() {
    try {
        cameraStream = await navigator.mediaDevices.getUserMedia({
            video: true,
            audio: false
        });

        videoElem.srcObject = cameraStream;
        await videoElem.play();
        return videoElem;

    } catch (error) {
        console.error("Gagal mengakses kamera:", error);

        if (error.name === "NotAllowedError") {
            alert("Izin kamera ditolak. Silakan izinkan akses kamera pada browser.");
        } 
        else if (error.name === "NotFoundError") {
            alert("Kamera tidak ditemukan.");
        } 
        else {
            alert("Tidak dapat membuka kamera: " + error.message);
        }

        return null;
    }
}


// ==================================================
// 2. HANDLER TOMBOL BUKA KAMERA
// ==================================================
async function tanganiMulaiKamera() {
    const video = await mulaiKamera();

    if (video) {
        document.getElementById('hasil').innerText =
            "Kamera aktif. Silakan ambil frame.";
    }
}


// ==================================================
// 3. MENGAMBIL FRAME DARI KAMERA
// ==================================================
function ambilFrame(video, canvas) {
    const ctx = canvas.getContext('2d');

    // DIPERBAIKI: Menggunakan operator logika/nilai default yang benar (||)
    canvas.width = video.videoWidth || 320;
    canvas.height = video.videoHeight || 240;

    ctx.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
    );

    return ctx.getImageData(
        0,
        0,
        canvas.width,
        canvas.height
    );
}


// ==================================================
// 4. HANDLER TOMBOL AMBIL FRAME
// ==================================================
function tanganiAmbilFrame() {
    if (!cameraStream) {
        alert("Silakan buka kamera terlebih dahulu.");
        return;
    }

    lastImageData = ambilFrame(
        videoElem,
        canvasElem
    );

    document.getElementById('hasil').innerText =
        "Frame berhasil diambil.";
}


// ==================================================
// 5. MENGHITUNG RATA-RATA KECERAHAN
// ==================================================
function rataKecerahan(imageData) {
    const d = imageData.data;
    let total = 0;

    for (let i = 0; i < d.length; i += 4) {
        total += (
            d[i] +
            d[i + 1] +
            d[i + 2]
        ) / 3;
    }

    const jumlahPixel = d.length / 4;
    return total / jumlahPixel;
}


// ==================================================
// 6. HANDLER TOMBOL RATA KECERAHAN
// ==================================================
function tanganiHitungKecerahan() {
    if (!lastImageData) {
        if (!cameraStream) {
            alert("Silakan buka kamera terlebih dahulu.");
            return;
        }

        lastImageData = ambilFrame(
            videoElem,
            canvasElem
        );
    }

    const kecerahan = rataKecerahan(lastImageData);

    // DIPERBAIKI: Menggunakan template literal backtick (``) yang benar
    document.getElementById('hasil').innerText = `Kecerahan: \${kecerahan.toFixed(2)}`;
}
</script>
